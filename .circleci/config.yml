defaults: &defaults
  docker:
    - image: circleci/node:8-browsers
version: 2
jobs:
  install:
    <<: *defaults
    steps:
      - checkout
      - restore_cache:
          key: dependency-cache-{{ checksum "yarn.lock" }}
      - run: yarn install
      - save_cache:
          key: dependency-cache-{{ checksum "yarn.lock" }}
          paths:
            - ./node_modules
  lint:
    <<: *defaults
    steps:
      - run: yarn lint
  test:
    <<: *defaults
    steps:
      - run: yarn test:ci
  build:
    <<: *defaults
    steps:
      - run: yarn build:ci
workflows:
  version: 2
  build-and-test:
    jobs:
      - install
      - lint:
        - requires:
          - install
      - test:
        - requires:
          - install
      - build:
        - requires:
          - install

