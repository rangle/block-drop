defaults:
  docker: &ref_0
    - image: 'circleci/node:8-browsers'
version: 2
jobs:
  install:
    docker: *ref_0
    steps:
      - checkout
      - restore_cache:
          key: 'dependency-cache-{{ checksum "yarn.lock" }}'
      - run: yarn install
      - save_cache:
          key: 'dependency-cache-{{ checksum "yarn.lock" }}'
          paths:
            - ./node_modules
  lint:
    docker: *ref_0
    steps:
      - run: yarn lint
  test:
    docker: *ref_0
    steps:
      - run: 'yarn test:ci'
  build:
    docker: *ref_0
    steps:
      - run: 'yarn build:ci'
workflows:
  version: 2
  build-and-test:
    jobs:
      - install
      - lint:
          requires:
            - install
      - test:
          requires:
            - install
      - build:
          requires:
            - install
